<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //static
        var a=10;
        var b=10;
        document.write(a+b);

        //dynamicc
        var a=parseInt(prompt("enter the first number"))
        var b=parseInt(prompt("enter the second number"))
        document.write(a+b);
        //datatypee
        let c=5;
        const b=6;
        document.write(c,b)
    </script>
</body>
</html>
