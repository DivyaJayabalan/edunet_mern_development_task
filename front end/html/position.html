<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: beige;
            width:500px;
            height: 500px;
        }
        .static{
            background-color: cadetblue;
            top:0px;
            left: 0px;
            position: static;
        }
        .relative{
            background-color: rgb(131, 95, 160);
            top:0px;
            left: 0px;
            position: relative;
        }
        .absolute{
            background-color: rgb(207, 188, 15);
            top:0px;
            left: 0px;
            position: absolute;
        }
        .fixed{
            background-color: rgb(202, 10, 58);
            top:0px;
            left: 0px;
            position: fixed;
        }
        .sticky{
            background-color: aquamarine;
            top:0px;
            left: 0px;
            position: sticky;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="static">static</div>
        <div class="relative">relative</div>
        <div class="absolute">absolute</div>
        <div class="fixed">fixed</div>
        <div class="sticky">sticky</div>
        
     
    </div>
    
</body>
</html>
